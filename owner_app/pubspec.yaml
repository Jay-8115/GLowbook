publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0-deprecated-soon
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.1.2
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.1.2
  shimmer: ^3.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
