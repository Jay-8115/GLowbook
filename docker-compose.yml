version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: glowbook_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glowbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Cache & Job Queues
  redis:
    image: redis:7-alpine
    container_name: glowbook_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Node/Next.js WebSocket Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glowbook_backend
    restart: always
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/glowbook?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=glowbook_access_secret_123!@#
      - JWT_REFRESH_SECRET=glowbook_refresh_secret_987!@#
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  # 4. Admin Next.js Dashboard
  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    container_name: glowbook_admin
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  # 5. Nginx Load Balancer Proxy
  nginx:
    image: nginx:alpine
    container_name: glowbook_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin_dashboard

volumes:
  postgres_data:
